name: Deploy

# Unified deploy: builds the Astro dashboard, then deploys the Worker
# which bundles the dashboard's `dist/` as static assets via the
# [assets] binding in wrangler.toml.
#
# wrangler.toml is gitignored. This workflow materialises a minimal
# version from GitHub secrets at deploy time. All sensitive runtime
# config (CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD, CF_API_TOKEN, etc)
# lives in Cloudflare itself via `wrangler secret put` and is never
# touched by this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'packages/dashboard/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Generate the two gitignored config files. Values are sourced
      # from GitHub secrets (not variables) so when the repo is public
      # nothing about the deployment is exposed.
      - name: Generate wrangler.toml
        working-directory: packages/api
        env:
          WORKER_NAME_RAW: ${{ secrets.WORKER_NAME }}
          CUSTOM_DOMAIN_RAW: ${{ secrets.CUSTOM_DOMAIN }}
        run: |
          # Trim stray whitespace/newlines — GitHub secrets pasted from
          # some UIs include a trailing \n that breaks TOML string values.
          WORKER_NAME=$(printf '%s' "$WORKER_NAME_RAW" | tr -d '\r\n' | awk '{$1=$1};1')
          CUSTOM_DOMAIN=$(printf '%s' "$CUSTOM_DOMAIN_RAW" | tr -d '\r\n' | awk '{$1=$1};1')
          if [ -z "$WORKER_NAME" ] || [ -z "$CUSTOM_DOMAIN" ]; then
            echo "::error::WORKER_NAME and CUSTOM_DOMAIN must be set as GitHub secrets"
            exit 1
          fi
          cat > wrangler.toml <<EOF
          name = "${WORKER_NAME}"
          main = "src/index.ts"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]

          routes = [
            { pattern = "${CUSTOM_DOMAIN}", custom_domain = true },
          ]

          [assets]
          directory = "../dashboard/dist"
          binding = "ASSETS"
          not_found_handling = "single-page-application"
          run_worker_first = true

          [observability]
          enabled = true
          head_sampling_rate = 1

          [vars]
          ENVIRONMENT = "production"
          EOF

      - name: Generate dashboard config.ts
        working-directory: packages/dashboard/src
        env:
          WORKER_NAME_RAW: ${{ secrets.WORKER_NAME }}
          CF_BILLING_DAY_RAW: ${{ secrets.CF_BILLING_DAY }}
          BRAND_NAME_RAW: ${{ secrets.BRAND_NAME }}
        run: |
          WORKER_NAME=$(printf '%s' "$WORKER_NAME_RAW" | tr -d '\r\n' | awk '{$1=$1};1')
          CF_BILLING_DAY=$(printf '%s' "$CF_BILLING_DAY_RAW" | tr -d '\r\n' | awk '{$1=$1};1')
          BRAND_NAME=$(printf '%s' "$BRAND_NAME_RAW" | tr -d '\r\n' | awk '{$1=$1};1')
          cat > config.ts <<EOF
          export const CONFIG = {
            selfScriptName: '${WORKER_NAME}',
            cfBillingDay: ${CF_BILLING_DAY:-1},
            brandName: '${BRAND_NAME:-flarestat}',
          } as const;
          EOF

      - name: Typecheck API
        working-directory: packages/api
        run: pnpm run typecheck

      - name: Build dashboard
        working-directory: packages/dashboard
        env:
          PUBLIC_API_BASE: /api
        run: pnpm run build

      - name: Deploy Worker (with static assets)
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
